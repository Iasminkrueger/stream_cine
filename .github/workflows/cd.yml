
# Entrega Continua - Stream Cine
# Gera um pacote do codigo-fonte Flutter e promove o mesmo pacote
# de staging para producao, com aprovacao manual.

name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  preparar:
    name: Versao e pacote
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      release: ${{ steps.versao.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Calcula a proxima versao usando Conventional Commits
      - name: Calcular proxima versao
        id: versao
        env:
          NOTAS_ARQUIVO: notas-release.md
        run: node scripts/proxima-versao.mjs

      # Empacota o codigo-fonte do projeto Flutter
      - name: Empacotar projeto Flutter
        run: |
          mkdir pacote
          git archive HEAD | tar -x -C pacote
          echo "${{ steps.versao.outputs.versao }}" > pacote/VERSAO

      # Compacta o pacote em ZIP
      - name: Compactar pacote
        env:
          NOME: ${{ github.event.repository.name }}-${{ steps.versao.outputs.versao }}
        run: |
          test -d pacote || { echo "::error::A pasta pacote/ nao foi criada."; exit 1; }
          (cd pacote && zip -qr "../$NOME.zip" .)
          echo "Pacote gerado: $NOME.zip"

      # Guarda o pacote para reutilizar em staging e producao
      - name: Guardar pacote
        uses: actions/upload-artifact@v7
        with:
          name: pacote
          path: |
            *.zip
            notas-release.md
          retention-days: 30

  staging:
    name: Staging
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacote

      - name: Extrair pacote
        run: mkdir site && unzip -q ./*.zip -d site

      - name: Resumo do staging
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
          RELEASE: ${{ needs.preparar.outputs.release }}
        run: |
          {
            echo "## Staging - v$VERSAO"
            echo "- Pacote candidato disponivel nos Artifacts desta execucao."
            if [ "$RELEASE" = "true" ]; then
              echo "- Confira o pacote e aprove o job Producao."
            else
              echo "- Sem nova versao: nao sera criada uma Release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  producao:
    name: Producao
    needs: [preparar, staging]
    if: needs.preparar.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.preparar.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: pacote
          path: entrega

      # Cria a tag e a Release com o pacote gerado anteriormente
      - name: Criar baseline - tag e Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.preparar.outputs.versao }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::Tag $TAG ja existe - nada a fazer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          gh release create "$TAG" entrega/*.zip \
            --title "$TAG" \
            --notes-file entrega/notas-release.md \
            --verify-tag
